<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <style>
      .box{rx:12;ry:12;stroke:#333;stroke-width:1.5;}
      .lbl{font-size:16px;fill:#1b2733;font-weight:bold;}
      .sub{font-size:13px;fill:#1b2733;}
      .wht{font-size:17px;fill:#ffffff;font-weight:bold;}
      .wsub{font-size:12px;fill:#eef2ff;}
      .edge{stroke:#555;stroke-width:2;fill:none;}
      .elbl{font-size:12.5px;fill:#444;}
      .diamondtxt{font-size:15px;fill:#1b2733;font-weight:bold;}
    </style>
  </defs>

  <rect width="640" height="720" fill="#ffffff"/>
  <text x="320" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#1F3A5F">Ghost-Free Elevator — control logic</text>

  <!-- Standby -->
  <rect class="box" x="220" y="56" width="200" height="54" fill="#E5E7EB"/>
  <circle cx="246" cy="83" r="7" fill="#9AA3AD" stroke="#333"/>
  <text class="lbl" x="266" y="81">STANDBY</text>
  <text class="sub" x="266" y="99">all LEDs off</text>

  <!-- arrow to requested -->
  <path class="edge" d="M320,110 L320,150" marker-end="url(#arrow)"/>
  <text class="elbl" x="330" y="134">stop button pressed</text>

  <!-- Floor requested (Yellow) -->
  <rect class="box" x="200" y="150" width="240" height="58" fill="#F6C445"/>
  <circle cx="228" cy="179" r="8" fill="#F2B705" stroke="#333"/>
  <text class="lbl" x="250" y="176">FLOOR REQUESTED</text>
  <text class="sub" x="250" y="195">Yellow LED on</text>

  <!-- arrow to decision -->
  <path class="edge" d="M320,208 L320,258" marker-end="url(#arrow)"/>
  <text class="elbl" x="330" y="236">elevator approaches → read PIR sensor</text>

  <!-- Decision diamond -->
  <polygon points="320,258 450,330 320,402 190,330" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text class="diamondtxt" x="320" y="326" text-anchor="middle">Motion</text>
  <text class="diamondtxt" x="320" y="346" text-anchor="middle">detected?</text>

  <!-- YES branch (left) -->
  <path class="edge" d="M190,330 L120,330 L120,470" marker-end="url(#arrow)"/>
  <text class="elbl" x="120" y="322" text-anchor="middle">YES — person</text>

  <!-- NO branch (right) -->
  <path class="edge" d="M450,330 L520,330 L520,470" marker-end="url(#arrow)"/>
  <text class="elbl" x="520" y="322" text-anchor="middle">NO — empty</text>

  <!-- STOP (Blue) -->
  <rect class="box" x="20" y="470" width="200" height="66" fill="#3B74E8"/>
  <circle cx="48" cy="503" r="8" fill="#2A5BD0" stroke="#dbe4ff"/>
  <text class="wht" x="70" y="499">STOP</text>
  <text class="wsub" x="70" y="518">Blue LED · elevator stops</text>

  <!-- PASS (Red) -->
  <rect class="box" x="420" y="470" width="200" height="66" fill="#E0564E"/>
  <circle cx="448" cy="503" r="8" fill="#C9433B" stroke="#ffe3e1"/>
  <text class="wht" x="470" y="499">PASS</text>
  <text class="wsub" x="470" y="518">Red LED · elevator passes</text>

  <!-- back to standby -->
  <path class="edge" d="M120,536 L120,620 L320,620" marker-end="url(#arrow)"/>
  <path class="edge" d="M520,536 L520,620 L320,620" marker-end="url(#arrow)"/>
  <rect class="box" x="220" y="600" width="200" height="48" fill="#EEF2F7"/>
  <text class="sub" x="320" y="629" text-anchor="middle" font-weight="bold">ready for next request</text>

  <path class="edge" d="M320,600 C150,590 150,150 218,92" marker-end="url(#arrow)"/>
  <text class="elbl" x="96" y="360" transform="rotate(-90 96,360)" text-anchor="middle">reset → standby</text>
</svg>
